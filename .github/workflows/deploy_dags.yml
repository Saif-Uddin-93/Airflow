name: Deploy Airflow DAGs (Rsync)

# Trigger the workflow when code is pushed/merged to the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'

jobs:
  deploy:
    name: Git Pull and Rsync
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Navigating to the repository..."
            cd ~/airflow/github/Airflow
            
            echo "Pulling latest changes from main branch..."
            git pull origin main
            
            echo "Syncing dags folder to Airflow using rsync..."
            rsync -av --delete ~/airflow/github/Airflow/dags/ ~/airflow/dags/
            
            echo "Deployment complete!"