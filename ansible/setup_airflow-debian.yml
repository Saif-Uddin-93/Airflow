- name: Setup Apache Airflow on Debian Trixie
  hosts: airflow_servers
  become: yes

  tasks:
    - name: Install system dependencies
      apt:
        update_cache: yes
        name: 
          - python3.13
          - python3.13-venv
          - postgresql
          - postgresql-contrib
          - locales
          - acl
          - curl
          - python3-psycopg2
          - build-essential
          - libpq-dev
          - python3-dev
        state: present

    - name: Set system locale to C.UTF-8
      command: update-locale LANG=C.UTF-8 LC_ALL=C.UTF-8

    - name: Ensure PostgreSQL is running
      service: { name: postgresql, state: started, enabled: yes }

    - name: Create the airflow_admin OS user
      user:
        name: "{{ airflow_user }}"
        shell: /bin/bash
        create_home: yes

    - name: Create Airflow PostgreSQL user and databases
      become_user: postgres
      postgresql_user:
        name: "{{ airflow_db_user }}"
        password: "{{ airflow_db_password }}"
        role_attr_flags: NOSUPERUSER,CREATEDB

    - name: Create Airflow metadata database
      become_user: postgres
      postgresql_db:
        name: "{{ airflow_db_name }}"
        owner: "{{ airflow_db_user }}"

    - name: Create Mock source database
      become_user: postgres
      postgresql_db:
        name: "{{ source_db_name }}"
        owner: "{{ airflow_db_user }}"

    - name: Create Cleaned target database
      become_user: postgres
      postgresql_db:
        name: "{{ target_db_name }}"
        owner: "{{ airflow_db_user }}"

    - name: Create .env file for Airflow Connections
      become_user: "{{ airflow_user }}"
      copy:
        dest: "/home/{{ airflow_user }}/.env"
        content: |
          # The Source database (Extract)
          AIRFLOW_CONN_SOURCE_DB_CONN={{ source_db_conn }}
          # The Target database (Load)
          AIRFLOW_CONN_TARGET_DB_CONN={{ target_db_conn }}
        mode: '0600'

    - name: Download uv archive
      get_url:
        url: https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-musl.tar.gz
        dest: /tmp/uv.tar.gz

    - name: Extract uv binary
      unarchive:
        src: /tmp/uv.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Move uv to /usr/bin
      copy:
        src: /tmp/uv-x86_64-unknown-linux-musl/uv
        dest: /usr/bin/uv
        mode: '0755'
        remote_src: yes

    - name: Create Virtual Environment with Python 3.13 using uv
      become_user: "{{ airflow_user }}"
      shell: "/usr/bin/uv venv {{ venv_path }} --python python3.13"
      args:
        creates: "{{ venv_path }}"

    - name: Install Airflow using uv
      become_user: "{{ airflow_user }}"
      shell: |
        source {{ venv_path }}/bin/activate
        uv pip install \
          "apache-airflow[postgres]=={{ airflow_version }}" \
          legacy-cgi
      args:
        executable: /bin/bash

    - name: Configure environment variables in .bashrc
      become_user: "{{ airflow_user }}"
      blockinfile:
        path: "/home/{{ airflow_user }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK AIRFLOW"
        block: |
          export AIRFLOW_HOME={{ airflow_home }}
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="{{ airflow_db_conn }}"

    - name: Ensure DAGs directory exists
      become_user: "{{ airflow_user }}"
      file:
        path: "{{ airflow_home }}/dags"
        state: directory
        mode: '0755'

    - name: Initialize Airflow Database
      become_user: "{{ airflow_user }}"
      shell: |
        source {{ venv_path }}/bin/activate
        airflow db migrate
      args:
        executable: /bin/bash
      environment:
        AIRFLOW_HOME: "{{ airflow_home }}"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "{{ airflow_db_conn }}"

    - name: Update airflow.cfg - Change to LocalExecutor
      become_user: "{{ airflow_user }}"
      replace:
        path: "{{ airflow_home }}/airflow.cfg"
        regexp: 'executor = SequentialExecutor'
        replace: 'executor = LocalExecutor'

    - name: Update airflow.cfg - Disable example DAGs
      become_user: "{{ airflow_user }}"
      replace:
        path: "{{ airflow_home }}/airflow.cfg"
        regexp: 'load_examples = True'
        replace: 'load_examples = False'

    - name: Sync Airflow roles and permissions
      become_user: "{{ airflow_user }}"
      shell: |
        source {{ venv_path }}/bin/activate
        airflow sync-perm
      args:
        executable: /bin/bash
      environment:
        AIRFLOW_HOME: "{{ airflow_home }}"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "{{ airflow_db_conn }}"

    - name: Create Airflow Admin User
      become_user: "{{ airflow_user }}"
      shell: |
        source {{ venv_path }}/bin/activate
        airflow users create \
          --username {{ airflow_create_admin_user }} \
          --firstname {{ airflow_create_admin_first_name }} \
          --lastname {{ airflow_create_admin_last_name }} \
          --role {{ airflow_create_admin_role }} \
          --email {{ airflow_create_admin_email }} \
          --password {{ airflow_create_admin_password }}
      args:
        executable: /bin/bash
      register: admin_create_output
      failed_when: "'already exists' not in admin_create_output.stdout and admin_create_output.rc != 0"
      changed_when: "'created' in admin_create_output.stdout"
      environment:
        AIRFLOW_HOME: "{{ airflow_home }}"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "{{ airflow_db_conn }}"

    - name: Create Airflow Readonly User
      become_user: "{{ airflow_user }}"
      shell: |
        source {{ venv_path }}/bin/activate
        airflow users create \
          --username {{ airflow_create_readonly_user }} \
          --firstname {{ airflow_create_readonly_first_name }} \
          --lastname {{ airflow_create_readonly_last_name }} \
          --role {{ airflow_create_readonly_role }} \
          --email {{ airflow_create_readonly_email }} \
          --password {{ airflow_create_readonly_password }}
      args:
        executable: /bin/bash
      register: readonly_create_output
      failed_when: "'already exists' not in readonly_create_output.stdout and readonly_create_output.rc != 0"
      changed_when: "'created' in readonly_create_output.stdout"
      environment:
        AIRFLOW_HOME: "{{ airflow_home }}"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "{{ airflow_db_conn }}"

    - name: Populate Mock Source Data
      become_user: "{{ airflow_user }}"
      shell: |
        psql -d {{ source_db_name }} -h localhost -U {{ source_db_user }} <<EOF
        CREATE TABLE IF NOT EXISTS source_orders (
            order_id INT PRIMARY KEY,
            customer_name VARCHAR(100),
            order_total NUMERIC,
            order_date DATE
        );
        INSERT INTO source_orders (order_id, customer_name, order_total, order_date) VALUES
        (1, 'Alice Smith', 150.00, '2026-04-10'),
        (2, 'Bob Jones', 85.50, '2026-04-11'),
        (3, 'Charlie Brown', 210.25, '2026-04-12')
        ON CONFLICT DO NOTHING;
        EOF
      environment:
        PGPASSWORD: "{{ source_db_password }}"

    - name: Install Git sync cron job for Airflow user
      ansible.builtin.cron:
        name: "Git pull Airflow DAGs and sync uv dependencies"
        user: "{{ airflow_user }}"
        minute: "*"
        hour: "*"
        day: "*"
        month: "*"
        weekday: "*"
        job: 'GIT_SSH_COMMAND="ssh -i {{ git_ssh_key_path }}" cd {{ git_repo_dir }} && /usr/bin/git pull origin main >> {{ git_pull_log }} 2>&1 && /usr/bin/uv pip install --python {{ venv_path }} -r {{ git_repo_dir }}/requirements.txt >> {{ uv_install_log }} 2>&1'

    - name: Install log truncation cron job for Airflow user
      ansible.builtin.cron:
        name: "Truncate Airflow git pull log daily"
        user: "{{ airflow_user }}"
        minute: "0"
        hour: "0"
        job: "tail -n 1000 {{ git_pull_log }} > {{ git_pull_log }}.tmp && mv {{ git_pull_log }}.tmp {{ git_pull_log }}"

    - name: Create systemd service for Airflow Webserver
      copy:
        dest: /etc/systemd/system/airflow-webserver.service
        content: |
          [Unit]
          Description=Airflow webserver daemon
          After=network.target postgresql.service
          Wants=postgresql.service

          [Service]
          EnvironmentFile=/home/{{ airflow_user }}/.env
          User={{ airflow_user }}
          Group={{ airflow_user }}
          Type=simple
          Environment="AIRFLOW_HOME={{ airflow_home }}"
          Environment="AIRFLOW__DATABASE__SQL_ALCHEMY_CONN={{ airflow_db_conn }}"
          ExecStart={{ venv_path }}/bin/airflow webserver
          Restart=on-failure
          RestartSec=5s
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target

    - name: Create systemd service for Airflow Scheduler
      copy:
        dest: /etc/systemd/system/airflow-scheduler.service
        content: |
          [Unit]
          Description=Airflow scheduler daemon
          After=network.target postgresql.service
          
          [Service]
          EnvironmentFile=/home/{{ airflow_user }}/.env
          User={{ airflow_user }}
          Group={{ airflow_user }}
          Type=simple
          Environment="AIRFLOW_HOME={{ airflow_home }}"
          Environment="AIRFLOW__DATABASE__SQL_ALCHEMY_CONN={{ airflow_db_conn }}"
          ExecStart={{ venv_path }}/bin/airflow scheduler
          Restart=on-failure
          RestartSec=5s
          
          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and enable Airflow services
      systemd:
        daemon_reload: yes
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - airflow-webserver
        - airflow-scheduler